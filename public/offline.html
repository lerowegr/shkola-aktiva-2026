<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет связи — Школа Актива</title>
    <meta name="theme-color" content="#252525" />
    <!--
      Страница самостоятельная: ни сборки, ни шрифтов, ни внешних файлов.
      Её показывают, когда сеть не отвечает, — значит, подгрузить ей нечего.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #252525; color: #fdfdfb; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mark {
        display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px;
        background: #c6ffa8; color: #252525; font: 700 22px/1 monospace; letter-spacing: 1px;
      }
      h1 { margin: 20px 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; color: #bdbdb8; line-height: 1.5; }
      button {
        min-height: 48px; padding: 0 22px; border: 0; border-radius: 16px;
        background: #1c63ff; color: #fff; font: 600 16px/1 inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">ША</span>
      <h1>Нет связи</h1>
      <p>Проверьте интернет. Ответы анкеты, которые успели сохраниться, никуда не денутся.</p>
      <button type="button" onclick="location.reload()">Попробовать ещё раз</button>
    </main>
  </body>
</html>
